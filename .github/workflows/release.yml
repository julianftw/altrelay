name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs; Dependabot keeps them current.

jobs:
  release:
    name: Verify, build and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Verify every version reference matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"

          HEADER_VERSION=$(grep -m1 '^ \* Version:' altrelay.php | sed 's/.*Version:[[:space:]]*//')
          CONST_VERSION=$(grep -m1 "define( 'ALTRELAY_VERSION'" altrelay.php | sed "s/.*'ALTRELAY_VERSION', '\([^']*\)'.*/\1/")
          STABLE_TAG=$(grep -m1 '^Stable tag:' readme.txt | sed 's/Stable tag:[[:space:]]*//')
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          BOOTSTRAP_VERSION=$(grep -m1 "define( 'ALTRELAY_VERSION'" phpstan-bootstrap.php | sed "s/.*'ALTRELAY_VERSION', '\([^']*\)'.*/\1/")
          CHANGELOG_ENTRY=$(grep -c "^= ${TAG} =" readme.txt || true)

          echo "Tag:              $TAG"
          echo "Plugin header:    $HEADER_VERSION"
          echo "ALTRELAY_VERSION:  $CONST_VERSION"
          echo "Stable tag:       $STABLE_TAG"
          echo "package.json:     $PACKAGE_VERSION"
          echo "phpstan bootstrap:$BOOTSTRAP_VERSION"

          FAILED=0
          for pair in \
            "plugin header:$HEADER_VERSION" \
            "ALTRELAY_VERSION:$CONST_VERSION" \
            "Stable tag:$STABLE_TAG" \
            "package.json:$PACKAGE_VERSION" \
            "phpstan bootstrap:$BOOTSTRAP_VERSION"; do
            NAME="${pair%%:*}"
            VALUE="${pair#*:}"
            if [ "$VALUE" != "$TAG" ]; then
              echo "::error::$NAME is '$VALUE' but the tag is '$TAG'."
              FAILED=1
            fi
          done

          if [ "$CHANGELOG_ENTRY" -lt 1 ]; then
            echo "::error::readme.txt has no '= $TAG =' changelog entry."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Run PHP checks
        run: composer check

      - name: Run JavaScript and CSS checks
        run: |
          npm run lint:js
          npm run lint:css
          npm run test:coverage

      - name: Build distribution ZIP
        run: bash build-zip.sh

      - name: Verify the ZIP holds only runtime files
        run: bash bin/verify-dist.sh dist/altrelay.zip

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./dist/altrelay

      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: altrelay-build
          path: dist/altrelay
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/altrelay.zip
          generate_release_notes: true

  deploy:
    name: Deploy to WordPress.org
    needs: release
    runs-on: ubuntu-latest
    # Runs only once the SVN credentials are configured, and only after the
    # release job verified versions, ran every check and built the ZIP.
    if: ${{ vars.WPORG_DEPLOY_ENABLED == 'true' }}
    environment: wordpress-org

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: altrelay-build
          path: dist/altrelay

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: altrelay
          BUILD_DIR: dist/altrelay
          ASSETS_DIR: .wordpress-org
